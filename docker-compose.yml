services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: f1telemetry
      MLFLOW_TRACKING_URI: file:/app/mlruns
      # Set this to a run ID from your channel-ablation sweep (or the
      # earlier LSTM training) before `docker compose up`, e.g.:
      #   MODEL_RUN_ID=<run id> docker compose up --build
      MODEL_RUN_ID: ${MODEL_RUN_ID:-}
      WINDOW_SIZE: ${WINDOW_SIZE:-20}
      STRIDE: ${STRIDE:-10}
    volumes:
      # MLflow's local file-based tracking store - the API loads its model
      # straight from here, so it has to see the same runs your training
      # scripts wrote outside of Docker.
      - ./mlruns:/app/mlruns:ro
      # Telemetry parquet files, so /score can be pointed at
      # data/raw/telemetry_all.parquet etc. without copying it into the image.
      - ./data:/app/data:ro
    depends_on:
      - mongo

volumes:
  mongo_data:
